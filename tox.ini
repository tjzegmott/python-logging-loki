[tox]
# List of Python versions to test against
envlist = py38,py39,py310,py311,py312,py313,ruff
isolated_build = true

[gh-actions]
# Map the CI job's interpreter to the envs it should run, so each matrix
# entry runs its own testenv instead of skipping the rest of the envlist.
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311, ruff
    3.12: py312
    3.13: py313

[testenv]
setenv =
        LC_ALL = en_US.UTF-8
        LANG = en_US.UTF-8
deps =
        pytest
        coverage
        freezegun
commands =
    coverage run -m pytest []
    coverage report
    coverage xml

[testenv:ruff]
skip_install = true
# Use whatever python3 is available on your system
basepython = python3
deps = ruff
commands =
    # First fix auto-fixable issues
    ruff check --fix .
    ruff format .
    # Then check for any remaining issues
    ruff check .
    ruff format --check .
