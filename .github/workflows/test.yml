name: Python Tests with Tox

on:
  pull_request:
    branches: [ master ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pinned rather than ubuntu-latest: setup-python has no 3.8/3.9 builds
    # for ubuntu-26.04, and 24.04 covers every version we support.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with setup.py's python_requires/classifiers and
        # tox.ini's envlist + [gh-actions] mapping.
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Run tox
      run: tox

    # Only report once: every matrix entry produces an equivalent coverage.xml.
    - name: Code Coverage Summary Report
      if: matrix.python-version == '3.11'
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        badge: true
        format: markdown
        thresholds: '80 100'
        output: 'both'
        fail_below_min: 'true'
        indicators: 'true'
